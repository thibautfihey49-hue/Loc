name: Build APK Debug
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK Enfant
        uses: actions/upload-artifact@v4
        with:
          name: app-child-debug
          path: app-child/build/outputs/apk/debug/app-child-debug.apk
          retention-days: 30
      - name: Upload APK Parent
        uses: actions/upload-artifact@v4
        with:
          name: app-parent-debug
          path: app-parent/build/outputs/apk/debug/app-parent-debug.apk
          retention-days: 30
