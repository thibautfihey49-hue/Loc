name: Build APK Debug
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ Installe Gradle et génère le wrapper AUTOMATIQUEMENT
      - name: Setup Gradle
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          rm -rf gradle-8.2 gradle-8.2-bin.zip

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Enfant
        uses: actions/upload-artifact@v4
        with:
          name: app-child-debug
          path: app-child/build/outputs/apk/debug/app-child-debug.apk
          retention-days: 30

      - name: Upload APK Parent
        uses: actions/upload-artifact@v4
        with:
          name: app-parent-debug
          path: app-parent/build/outputs/apk/debug/app-parent-debug.apk
          retention-days: 30
